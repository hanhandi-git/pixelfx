<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pixelfx workbench</title>
<link rel="icon" href="data:,">
<meta name="description" content="A browser-only workbench for previewing pixelfx effects.">
<link rel="stylesheet" href="workbench.css">
</head>
<body>
<header class="wb-head">
  <div>
    <a class="back" href="index.html">← gallery</a> · <a class="back" href="fantasy.html">fantasy encounters</a>
    <h1>pixelfx workbench</h1>
    <p id="count">loading effects…</p>
  </div>
</header>
<main class="wb-layout">
  <aside class="library" aria-label="Effect library">
    <div class="library-head">
      <h2>effects</h2>
      <input id="search" type="search" placeholder="search" aria-label="Search effects" autocomplete="off">
    </div>
    <div class="origins" id="origins" role="toolbar" aria-label="Effect source"></div>
    <div class="categories" id="categories" role="toolbar" aria-label="Categories"></div>
    <div class="effect-list" id="effect-list" role="listbox" aria-label="Effects"></div>
  </aside>
  <section class="preview" aria-label="Effect preview">
    <div class="preview-head">
      <div>
        <div class="eyebrow">selected effect</div>
        <h2 id="effect-name">Choose an effect</h2>
        <div class="effect-id" id="effect-id">Click an item in the library to start previewing.</div>
      </div>
      <div class="status" id="status">ready</div>
    </div>
    <div class="stage"><canvas id="stage" aria-label="Live effect preview"></canvas></div>
    <div class="controls">
      <button class="control primary" id="play" type="button">pause</button>
      <button class="control" id="again" type="button">replay</button>
      <button class="control" id="previous" type="button">previous</button>
      <button class="control" id="next" type="button">next</button>
      <label class="speed">speed <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
    </div>
    <div class="details">
      <p id="description">Select an effect to inspect its animation.</p>
      <dl id="facts"></dl>
    </div>
  </section>
</main>
<script type="module" src="workbench.js"></script>
</body>
</html>
